services:
  - type: web
    name: status-report-ilc
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: AZURE_DEVOPS_ORG_URL
        value: https://projetosmirassol1.visualstudio.com
      - key: AZURE_DEVOPS_PAT
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
